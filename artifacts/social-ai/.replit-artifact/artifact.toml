kind = "web"
previewPath = "/"
title = "Social AI Content Creator"
version = "1.0.0"
id = "artifacts/social-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21173

[services.development]
run = "pnpm --filter @workspace/social-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-ai", "run", "build" ]
publicDir = "artifacts/social-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21173"
BASE_PATH = "/"
