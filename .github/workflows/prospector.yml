name: Strauss Prospector
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sector: { description: Sector, default: clínicas estéticas }
      zona: { description: Zona, default: Palma de Mallorca }
      revisar: { description: Negocios a revisar, default: "20" }
      demos: { description: Demos a construir, default: "3" }
      publicar: { description: Publicar demos en Cloudflare Pages (s/n), default: "n" }
  schedule:
    - cron: "0 7 * * 1" # lunes 07:00 UTC con valores por defecto

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: strauss-prospector } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  run:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults: { run: { working-directory: strauss-prospector } }
    steps:
      - uses: actions/checkout@v5
      - name: Comprobar secretos necesarios
        shell: bash
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEMOS: ${{ inputs.demos || '3' }}
          PUBLICAR: ${{ inputs.publicar || 'n' }}
        run: |
          missing=()
          [[ -n "$GOOGLE_PLACES_API_KEY" ]] || missing+=("GOOGLE_PLACES_API_KEY")
          if [[ "${DEMOS:-3}" != "0" ]]; then
            [[ -n "$GEMINI_API_KEY" || -n "$OPENROUTER_API_KEY" ]] || missing+=("GEMINI_API_KEY o OPENROUTER_API_KEY")
          fi
          if [[ "${PUBLICAR:-n}" =~ ^(s|si|true|1)$ ]]; then
            [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
            [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          fi
          if (("${#missing[@]}" > 0)); then
            printf 'Faltan secretos de Actions: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "Secretos necesarios disponibles."
      - uses: actions/setup-node@v5
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node src/index.mjs
        env:
          SECTOR: ${{ inputs.sector || 'clínicas estéticas' }}
          ZONA: ${{ inputs.zona || 'Palma de Mallorca' }}
          REVISAR: ${{ inputs.revisar || '20' }}
          DEMOS: ${{ inputs.demos || '3' }}
          PUBLICAR: ${{ inputs.publicar || 'n' }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'upstage/solar-mini4' }}
      - name: Comprobar demos generadas en escritorio y móvil
        run: node --test src/output.test.mjs
        env:
          DEMOS: ${{ inputs.demos || '3' }}
      # Solo se ejecuta si la comprobación anterior pasa; publicar.mjs no hace nada si PUBLICAR no es s/si/true/1.
      - name: Publicar demos en Cloudflare Pages
        run: node src/publicar.mjs
        env:
          PUBLICAR: ${{ inputs.publicar || 'n' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: salida
          path: strauss-prospector/salida
