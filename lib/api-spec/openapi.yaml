openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Social AI Content Creator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Social media post operations
  - name: stats
    description: Stats and analytics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List all posts
      parameters:
        - name: platform
          in: query
          required: false
          schema:
            type: string
            enum: [instagram, tiktok, all]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, ready, published]
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a post by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
    put:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Post deleted

  /posts/{id}/generate:
    post:
      operationId: generatePostContent
      tags: [posts]
      summary: Generate AI content for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI content generated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/{id}/publish:
    post:
      operationId: publishPost
      tags: [posts]
      summary: Mark a post as published
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post marked as published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get content stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /stats/recent:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent post activity
      responses:
        "200":
          description: Recent posts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Post:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        context:
          type: string
        platform:
          type: string
          enum: [instagram, tiktok]
        status:
          type: string
          enum: [draft, ready, published]
        generatedCaption:
          type: string
          nullable: true
        generatedHashtags:
          type: string
          nullable: true
        generatedHooks:
          type: string
          nullable: true
        tone:
          type: string
          nullable: true
        targetAudience:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - topic
        - context
        - platform
        - status
        - createdAt
        - updatedAt

    CreatePostBody:
      type: object
      properties:
        topic:
          type: string
        context:
          type: string
        platform:
          type: string
          enum: [instagram, tiktok]
        tone:
          type: string
          nullable: true
        targetAudience:
          type: string
          nullable: true
      required:
        - topic
        - context
        - platform

    UpdatePostBody:
      type: object
      properties:
        topic:
          type: string
        context:
          type: string
        platform:
          type: string
          enum: [instagram, tiktok]
        tone:
          type: string
          nullable: true
        targetAudience:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, ready, published]
        generatedCaption:
          type: string
          nullable: true
        generatedHashtags:
          type: string
          nullable: true
        generatedHooks:
          type: string
          nullable: true

    StatsSummary:
      type: object
      properties:
        totalPosts:
          type: integer
        draftPosts:
          type: integer
        readyPosts:
          type: integer
        publishedPosts:
          type: integer
        instagramPosts:
          type: integer
        tiktokPosts:
          type: integer
      required:
        - totalPosts
        - draftPosts
        - readyPosts
        - publishedPosts
        - instagramPosts
        - tiktokPosts
